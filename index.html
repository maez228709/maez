<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ENGRAVIS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
/* ... (mantengo todo tu CSS original sin cambios) ... */
/* NUEVO: Overlay de iluminación de ARIA */
#aria-glow-overlay {
  position: fixed;
  pointer-events: none;
  z-index: 9998;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(0,200,255,0.25) 0%, rgba(0,150,220,0) 70%);
  width: 280px;
  height: 280px;
  opacity: 0;
  transition: opacity 0.4s ease;
  box-shadow: 0 0 80px 40px rgba(0,200,255,0.15);
}
</style>
</head>
<body>
<!-- ... (todo tu HTML original hasta el final del body) ... -->

<!-- NUEVO: Overlay de luz de ARIA -->
<div id="aria-glow-overlay"></div>

<div id="navis-wrap" style="left:calc(100vw - 190px);top:calc(100vh - 240px);z-index:9999;">
  <canvas id="navis-canvas" width="170" height="170"></canvas>
  <div id="navis-msg-wrap"></div>
  <div id="navis-input-wrap" style="display:none;">
    <input id="navis-inp" type="text" placeholder="Escribe a ARIA...">
  </div>
</div>

<script>
// ... (todo tu código anterior hasta la función nInit) ...

let isPinned = false;           // ← Nueva variable para fijar ARIA
let currentSafeZone = {x: window.innerWidth-190, y: window.innerHeight-240}; // zona inicial

// Actualizamos la función de movimiento
function moveNavis(){
  const wrap = document.getElementById('navis-wrap');
  if(isPinned){
    wrap.style.left = currentSafeZone.x + 'px';
    wrap.style.top  = currentSafeZone.y + 'px';
    requestAnimationFrame(moveNavis);
    return;
  }

  // Movimiento conversacional
  const speaking = nSpeaking;
  const idleDrift = speaking ? 0.8 : 2.5; // más calmado cuando habla

  nPX += nVX * idleDrift;
  nPY += nVY * idleDrift;

  // Pequeños movimientos aleatorios cortos (sin patrón)
  if(Math.random() < 0.03){
    nVX = (Math.random()-0.5) * (speaking ? 0.6 : 1.8);
    nVY = (Math.random()-0.5) * (speaking ? 0.6 : 1.8);
  }

  // Rebote suave en bordes pero respetando zonas vacías
  const pad = 120;
  if(nPX < pad) { nPX = pad; nVX = Math.abs(nVX)*1.2; }
  if(nPX > window.innerWidth-pad) { nPX = window.innerWidth-pad; nVX = -Math.abs(nVX)*1.2; }
  if(nPY < pad) { nPY = pad; nVY = Math.abs(nVY)*1.2; }
  if(nPY > window.innerHeight-pad) { nPY = window.innerHeight-pad; nVY = -Math.abs(nVY)*1.2; }

  // Sincronización con habla: pequeño "bob" vertical
  if(speaking){
    nPY += Math.sin(Date.now()/120) * 3;
  }

  wrap.style.left = nPX + 'px';
  wrap.style.top  = nPY + 'px';

  // Actualizar overlay de luz
  const glow = document.getElementById('aria-glow-overlay');
  glow.style.left = (nPX - 55) + 'px';
  glow.style.top  = (nPY - 55) + 'px';
  glow.style.opacity = speaking ? 0.35 : 0.12;

  requestAnimationFrame(moveNavis);
}

// Click para fijar / liberar ARIA
const canvas = document.getElementById('navis-canvas');
canvas.addEventListener('click', function(e){
  if(nDrag) return;
  isPinned = !isPinned;
  currentSafeZone = {x: nPX, y: nPY};
  
  const msg = isPinned 
    ? 'ARIA fijada en esta posición ✓' 
    : 'ARIA liberada y lista para moverse';
  nSpeak(msg);
  toast(msg);
});

// NUEVO: Aro de luz en Three.js (ring pulsante)
let glowRing;
function createGlowRing(){
  const ringGeo = new THREE.RingGeometry(1.05, 1.25, 64);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0x00ccff,
    transparent: true,
    opacity: 0.4,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending
  });
  glowRing = new THREE.Mesh(ringGeo, ringMat);
  scene.add(glowRing);
}

// En la función animate() agregamos:
function animate(){
  requestAnimationFrame(animate);
  tt += 0.016;

  // ... (tu código de streams anterior) ...

  if(glowRing){
    glowRing.rotation.z = tt * 1.8;
    glowRing.scale.setScalar(nSpeaking ? 1 + Math.sin(tt*12)*0.12 : 1);
    glowRing.material.opacity = nSpeaking ? 0.65 : 0.25;
  }

  renderer.render(scene, camera);
}

// Dentro de nInit() después de crear la escena:
createGlowRing();
moveNavis();   // ← ahora usa la nueva lógica conversacional

// ... resto de tu código sin cambios ...

</script>
</body>
</html>
