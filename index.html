<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ENGRAVIS ENERGY CORE</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
let scene = new THREE.Scene();

let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 5;

let renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// CONFIG
const LINES = 120;
const POINTS_PER_LINE = 120;
const RADIUS = 1.5;

let lines = [];

// crear filamentos
for (let i = 0; i < LINES; i++) {

    let geometry = new THREE.BufferGeometry();
    let positions = new Float32Array(POINTS_PER_LINE * 3);

    let theta = Math.random() * Math.PI * 2;
    let phi = Math.random() * Math.PI;

    for (let j = 0; j < POINTS_PER_LINE; j++) {

        let t = j / POINTS_PER_LINE;

        let angle = theta + t * Math.PI * 2;

        let x = RADIUS * Math.sin(phi) * Math.cos(angle);
        let y = RADIUS * Math.sin(phi) * Math.sin(angle);
        let z = RADIUS * Math.cos(phi);

        positions[j*3] = x;
        positions[j*3+1] = y;
        positions[j*3+2] = z;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    let material = new THREE.LineBasicMaterial({
        color: new THREE.Color(`hsl(${Math.random()*360},100%,60%)`),
        transparent: true,
        opacity: 0.7,
        blending: THREE.AdditiveBlending
    });

    let line = new THREE.Line(geometry, material);

    scene.add(line);
    lines.push({ line, baseTheta: theta, basePhi: phi });
}

// ANIMACIÓN
let time = 0;

function animate() {
    requestAnimationFrame(animate);

    time += 0.01;

    lines.forEach((obj, i) => {

        let positions = obj.line.geometry.attributes.position.array;

        for (let j = 0; j < POINTS_PER_LINE; j++) {

            let t = j / POINTS_PER_LINE;

            let flow = Math.sin(time + t * 10 + i);

            let radius = RADIUS + flow * 0.3;

            let angle = obj.baseTheta + t * Math.PI * 2 + time * 0.2;

            let x = radius * Math.sin(obj.basePhi) * Math.cos(angle);
            let y = radius * Math.sin(obj.basePhi) * Math.sin(angle);
            let z = radius * Math.cos(obj.basePhi + flow * 0.2);

            positions[j*3] = x;
            positions[j*3+1] = y;
            positions[j*3+2] = z;
        }

        obj.line.geometry.attributes.position.needsUpdate = true;

        // cambio de color dinámico
        let hue = (time * 40 + i * 5) % 360;
        obj.line.material.color.setHSL(hue / 360, 1, 0.6);
    });

    // rotación global
    scene.rotation.y += 0.002;

    renderer.render(scene, camera);
}

animate();

// resize
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
