<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ENGRAVIS CORE</title>
<style>
  body { margin: 0; overflow: hidden; background: black; }
</style>
</head>
<body>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
let scene = new THREE.Scene();
let camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
camera.position.z = 5;

let renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// PARTICLES
const count = 20000;
const geometry = new THREE.BufferGeometry();
const positions = new Float32Array(count * 3);

for (let i = 0; i < count; i++) {
    // iniciar desde bordes (cubo grande)
    positions[i*3] = (Math.random() - 0.5) * 20;
    positions[i*3+1] = (Math.random() - 0.5) * 20;
    positions[i*3+2] = (Math.random() - 0.5) * 20;
}

geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

let material = new THREE.PointsMaterial({
    size: 0.02,
    color: 0x00ffff
});

let points = new THREE.Points(geometry, material);
scene.add(points);

// TARGET (esfera)
let spherePositions = new Float32Array(count * 3);
for (let i = 0; i < count; i++) {
    let r = 1.5;
    let theta = Math.random() * Math.PI * 2;
    let phi = Math.acos((Math.random() * 2) - 1);

    spherePositions[i*3] = r * Math.sin(phi) * Math.cos(theta);
    spherePositions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    spherePositions[i*3+2] = r * Math.cos(phi);
}

let t = 0;

// ANIMACIÓN
function animate() {
    requestAnimationFrame(animate);

    let pos = geometry.attributes.position.array;

    for (let i = 0; i < count * 3; i++) {
        pos[i] += (spherePositions[i] - pos[i]) * 0.02;
    }

    geometry.attributes.position.needsUpdate = true;

    // vibración
    points.rotation.y += 0.001;

    // cambio de color dinámico
    let time = Date.now() * 0.001;
    material.color.setHSL((time * 0.1) % 1, 1, 0.5);

    renderer.render(scene, camera);
}

animate();

// resize
window.addEventListener("resize", () => {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>

</body>
</html>
