<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.D.C. Core - Despertar</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #ffffff; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #status {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0044aa;
            font-family: monospace;
            font-size: 12px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div id="status">SISTEMA: INICIALIZANDO NÚCLEO...</div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- SHADERS PERSONALIZADOS ---
        const _VS = `
            varying vec3 vColor;
            varying float vOpacity;
            uniform float uTime;
            uniform float uPulse;

            // Función de ruido para movimiento orgánico
            float hash(float n) { return fract(sin(n) * 43758.5453123); }
            
            void main() {
                vColor = color;
                
                // Dinámica de partículas: un pequeño baile tipo plasma
                float noise = sin(position.x * 2.0 + uTime) * cos(position.y * 2.0 + uTime);
                vec3 newPos = position + normalize(position) * noise * 0.1 * uPulse;
                
                vec4 mvPosition = modelViewMatrix * vec4(newPos, 1.0);
                
                // Tamaño basado en profundidad para dar volumen
                gl_PointSize = (15.0 * uPulse) * (1.0 / -mvPosition.z);
                gl_Position = projectionMatrix * mvPosition;
                
                vOpacity = 1.0 / (1.0 + length(newPos.xyz) * 0.2);
            }
        `;

        const _FS = `
            varying vec3 vColor;
            varying float vOpacity;

            void main() {
                // Crear partículas circulares con borde suave (Glow)
                float r = distance(gl_PointCoord, vec2(0.5));
                if (r > 0.5) discard;
                
                float strength = pow(1.0 - (r * 2.0), 2.0);
                gl_FragColor = vec4(vColor, strength * vOpacity);
            }
        `;

        // --- CONFIGURACIÓN ESCENA ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // --- CREACIÓN DEL NÚCLEO VIVO ---
        const particleCount = 25000;
        const geo = new THREE.BufferGeometry();
        
        const pos = new Float32Array(particleCount * 3);
        const targets = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        const colorBlue = new THREE.Color(0x00aaff);
        const colorCyan = new THREE.Color(0x00ffff);

        for (let i = 0; i < particleCount; i++) {
            // 1. INICIO: Salen de los bordes (extremos)
            pos[i*3] = (Math.random() - 0.5) * 15;
            pos[i*3+1] = (Math.random() - 0.5) * 15;
            pos[i*3+2] = (Math.random() - 0.5) * 15;

            // 2. DESTINO: Una esfera hueca con filamentos
            const radius = 1.5 + (Math.random() * 0.2); // Variación para grosor de la "cáscara"
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos((Math.random() * 2) - 1);

            targets[i*3] = radius * Math.sin(phi) * Math.cos(theta);
            targets[i*3+1] = radius * Math.sin(phi) * Math.sin(theta);
            targets[i*3+2] = radius * Math.cos(phi);

            // 3. COLORES: Mezcla entre azul y cian
            const mixedColor = Math.random() > 0.5 ? colorBlue : colorCyan;
            colors[i*3] = mixedColor.r;
            colors[i*3+1] = mixedColor.g;
            colors[i*3+2] = mixedColor.b;
        }

        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const mat = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uPulse: { value: 1.0 }
            },
            vertexShader: _VS,
            fragmentShader: _FS,
            transparent: true,
            blending: THREE.NormalBlending, // Cambiado para que se vea bien en fondo blanco
            vertexColors: true,
            depthTest: false
        });

        const core = new THREE.Points(geo, mat);
        scene.add(core);

        // --- LÓGICA DE ANIMACIÓN ---
        let clock = new THREE.Clock();
        let ready = false;

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            mat.uniforms.uTime.value = t;
            mat.uniforms.uPulse.value = 1.0 + Math.sin(t * 3.0) * 0.05; // El "latido"

            const positions = geo.attributes.position.array;

            // Convergencia inicial (El Despertar)
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                // Velocidad de atracción al centro
                positions[i3] += (targets[i3] - positions[i3]) * 0.03;
                positions[i3+1] += (targets[i3+1] - positions[i3+1]) * 0.03;
                positions[i3+2] += (targets[i3+2] - positions[i3+2]) * 0.03;
            }
            geo.attributes.position.needsUpdate = true;

            // Rotación suave del núcleo
            core.rotation.y += 0.003;
            core.rotation.z += 0.001;

            renderer.render(scene, camera);
        }

        // Ajuste de ventana
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
