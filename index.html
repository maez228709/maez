<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.D.C. Energy Core - Inteligencia Viva</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        canvas { display: block; }
        #overlay {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #0088ff;
            pointer-events: none;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 12px;
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <div id="overlay">Núcleo SDC Ecuador: Estado Operativo</div>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // --- SHADERS ---
        const vertexShader = `
            varying vec3 vPosition;
            varying float vGlow;
            uniform float uTime;
            uniform float uSize;
            uniform float uPulse;

            // Función de ruido simple para movimiento orgánico
            vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
            vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
            float snoise(vec3 v) {
                const vec2  C = vec2(1.0/6.0, 1.0/3.0) ;
                const vec4  D = vec4(0.0, 0.5, 1.0, 2.0);
                vec3 i  = floor(v + dot(v, C.yyy) );
                vec3 x0 = v - i + dot(i, C.xxx) ;
                vec3 g = step(x0.yzx, x0.xyz);
                vec3 l = 1.0 - g;
                vec3 i1 = min( g.xyz, l.zxy );
                vec3 i2 = max( g.xyz, l.zxy );
                vec3 x1 = x0 - i1 + C.xxx;
                vec3 x2 = x0 - i2 + C.yyy;
                vec3 x3 = x0 - D.yyy;
                i = mod289(i);
                vec4 p = permute( permute( permute( i.z + vec4(0.0, i1.z, i2.z, 1.0 )) + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
                vec4 j = p - 49.0 * floor(p * (1.0 / 49.0));
                vec4 x_ = floor(j * (1.0 / 7.0));
                vec4 y_ = floor(j - 7.0 * x_ );
                vec4 x = x_ * (1.0/7.0) + 0.5/7.0;
                vec4 y = y_ * (1.0/7.0) + 0.5/7.0;
                vec4 h = 1.0 - abs(x) - abs(y);
                vec4 b0 = vec4( x.xy, y.xy );
                vec4 b1 = vec4( x.zw, y.zw );
                vec4 s0 = floor(b0)*2.0 + 1.0;
                vec4 s1 = floor(b1)*2.0 + 1.0;
                vec4 sh = -step(h, vec4(0.0));
                vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
                vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
                vec3 p0 = vec3(a0.xy,h.x);
                vec3 p1 = vec3(a0.zw,h.y);
                vec3 p2 = vec3(a1.xy,h.z);
                vec3 p3 = vec3(a1.zw,h.w);
                vec4 norm = 1.79284291400159 - 0.85373472095314 * vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3));
                p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
                vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
                m = m * m;
                return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
            }

            void main() {
                vPosition = position;
                
                // Efecto de ondulación basado en ruido
                float noise = snoise(vec3(position * 2.0 + uTime * 0.5));
                vec3 newPos = position + (normalize(position) * noise * 0.15 * uPulse);
                
                // Brillo basado en la posición y el tiempo
                vGlow = pow(0.7 - dot(normalize(position), vec3(0,0,1)), 3.0);
                
                vec4 mvPosition = modelViewMatrix * vec4(newPos, 1.0);
                gl_PointSize = uSize * (300.0 / -mvPosition.z) * (1.0 + noise * 0.5);
                gl_Position = projectionMatrix * mvPosition;
            }
        `;

        const fragmentShader = `
            varying vec3 vPosition;
            varying float vGlow;
            uniform vec3 uColor;
            uniform float uTime;

            void main() {
                float dist = distance(gl_PointCoord, vec2(0.5));
                if (dist > 0.5) discard; // Hacer partículas redondas
                
                float strength = 1.0 - (dist * 2.0);
                vec3 color = mix(uColor, vec3(1.0), vGlow * 0.5);
                gl_FragColor = vec4(color, strength * 0.8);
            }
        `;

        // --- ESCENA ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xffffff);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 4;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // --- SISTEMA DE PARTÍCULAS (FILAMENTOS Y CORE) ---
        const particleCount = 15000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const destination = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount; i++) {
            // Posición inicial: bordes de la pantalla (el "Despertar")
            positions[i * 3] = (Math.random() - 0.5) * 20;
            positions[i * 3 + 1] = (Math.random() - 0.5) * 20;
            positions[i * 3 + 2] = (Math.random() - 0.5) * 20;

            // Destino: superficie de la esfera hueca
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 1.5;

            destination[i * 3] = r * Math.sin(phi) * Math.cos(theta);
            destination[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
            destination[i * 3 + 2] = r * Math.cos(phi);
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('target', new THREE.BufferAttribute(destination, 3));

        const material = new THREE.ShaderMaterial({
            uniforms: {
                uTime: { value: 0 },
                uColor: { value: new THREE.Color(0x0077ff) },
                uSize: { value: 2.5 },
                uPulse: { value: 1.0 }
            },
            vertexShader,
            fragmentShader,
            transparent: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const points = new THREE.Points(geometry, material);
        scene.add(points);

        // --- ANIMACIÓN ---
        let clock = new THREE.Clock();
        let introFinished = false;
        let lerpFactor = 0.02;

        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();
            material.uniforms.uTime.value = elapsed;

            // Simular pulsación (latido de vida)
            material.uniforms.uPulse.value = 1.0 + Math.sin(elapsed * 2.0) * 0.1;

            const posAttr = geometry.attributes.position;
            const targetAttr = geometry.attributes.target;

            // Fase de despertar: atraer partículas al centro
            if (!introFinished) {
                let closeCount = 0;
                for (let i = 0; i < particleCount; i++) {
                    posAttr.array[i * 3] += (targetAttr.array[i * 3] - posAttr.array[i * 3]) * lerpFactor;
                    posAttr.array[i * 3 + 1] += (targetAttr.array[i * 3 + 1] - posAttr.array[i * 3 + 1]) * lerpFactor;
                    posAttr.array[i * 3 + 2] += (targetAttr.array[i * 3 + 2] - posAttr.array[i * 3 + 2]) * lerpFactor;
                    
                    if (Math.abs(posAttr.array[i * 3] - targetAttr.array[i * 3]) < 0.1) closeCount++;
                }
                if (closeCount > particleCount * 0.9) introFinished = true;
                posAttr.needsUpdate = true;
            }

            // Rotación sutil
            points.rotation.y += 0.002;
            points.rotation.z += 0.001;

            renderer.render(scene, camera);
        }

        // --- INTERACCIÓN / EMOCIONES ---
        // Ejemplo de cómo cambiar el color según la "emoción" o interacción
        window.setCoreEmotion = function(type) {
            switch(type) {
                case 'alerta': 
                    material.uniforms.uColor.value.setHex(0xff3300); 
                    lerpFactor = 0.08;
                    break;
                case 'calma': 
                    material.uniforms.uColor.value.setHex(0x00ffcc); 
                    lerpFactor = 0.02;
                    break;
                case 'proceso': 
                    material.uniforms.uColor.value.setHex(0x9900ff); 
                    break;
                default: 
                    material.uniforms.uColor.value.setHex(0x0077ff);
            }
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
